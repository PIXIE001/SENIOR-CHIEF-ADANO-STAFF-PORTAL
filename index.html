   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAG Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf8ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #42a5d5;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      color: #1675a8;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1675a8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #105b83;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SAG</div>

    <h1>SAG STAFF PORTAL</h1>

    <p class="subtitle">
      Senior Chief Adano Girls Senior School
    </p>

    <input
      type="text"
      id="staffId"
      placeholder="Enter Staff ID"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <p class="footer">
      Staff Management & Attendance System
    </p>

  </div>

  <script>
    function login() {
      const staffId = document.getElementById("staffId").value;
      const password = document.getElementById("password").value;

      if (staffId === "" || password === "") {
        alert("Please enter your Staff ID and Password.");
        return;
      }

      alert("Login system is being developed.");
    }
  </script>

</body>
</html>
