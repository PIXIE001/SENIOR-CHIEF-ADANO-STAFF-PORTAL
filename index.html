   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAG Staff Portal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf8ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #42a5d5;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      color: #1675a8;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1675a8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #105b83;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SAG</div>

    <h1>SAG STAFF PORTAL</h1>

    <p class="subtitle">
      Senior Chief Adano Girls Senior School
    </p>

    <input
      type="text"
      id="staffId"
      placeholder="Enter Staff ID"
    >

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <p class="footer">
      Staff Management & Attendance System
    </p>

  </div>

  <script>
 <script>
  window.login = function () {
    const staffId = document.getElementById("staffId").value.trim();
    const password = document.getElementById("password").value.trim();

    if (staffId === "" || password === "") {
      alert("Please enter your Staff ID and Password.");
      return;
    }

    showDashboard(staffId);
  };

  function showDashboard(staffId) {
    document.body.innerHTML = `
      <style>
        * {
          box-sizing: border-box;
          font-family: Arial, sans-serif;
        }

        body {
          margin: 0;
          background: #f2f9fc;
          color: #333;
        }

        .dashboard {
          min-height: 100vh;
        }

        .topbar {
          background: #1675a8;
          color: white;
          padding: 20px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .topbar h2 {
          margin: 0;
        }

        .logout {
          background: white;
          color: #1675a8;
          border: none;
          padding: 10px 16px;
          border-radius: 8px;
          font-weight: bold;
          cursor: pointer;
        }

        .welcome {
          padding: 25px;
        }

        .welcome h1 {
          color: #1675a8;
        }

        .cards {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 18px;
          padding: 0 25px 25px;
        }

        .card {
          background: white;
          padding: 25px;
          border-radius: 15px;
          box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
          color: #1675a8;
        }

        .time {
          font-size: 25px;
          font-weight: bold;
        }

        .attendance {
          text-align: center;
        }

        .sign-in,
        .sign-out {
          width: 100%;
          padding: 15px;
          border: none;
          border-radius: 10px;
          color: white;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          margin-top: 10px;
        }

        .sign-in {
          background: #168a55;
        }

        .sign-out {
          background: #c0392b;
        }

        .status {
          margin-top: 15px;
          padding: 12px;
          border-radius: 8px;
          background: #eef6fa;
        }
      </style>

      <div class="dashboard">

        <div class="topbar">
          <h2>SAG STAFF PORTAL</h2>
          <button class="logout" onclick="location.reload()">
            LOGOUT
          </button>
        </div>

        <div class="welcome">
          <h1>Welcome, Staff ${staffId}</h1>
          <p>Senior Chief Adano Girls Senior School</p>
        </div>

        <div class="cards">

          <div class="card">
            <h3>📅 Today's Date</h3>
            <p id="date"></p>
          </div>

          <div class="card">
            <h3>🕐 Current Time</h3>
            <p class="time" id="clock"></p>
          </div>

          <div class="card attendance">
            <h3>Attendance</h3>

            <button class="sign-in" onclick="signIn()">
              SIGN IN
            </button>

            <button class="sign-out" onclick="signOut()">
              SIGN OUT
            </button>

            <div class="status" id="status">
              Status: Not signed in
            </div>
          </div>

        </div>
      </div>
    `;

    updateClock();
    setInterval(updateClock, 1000);
  }

  function updateClock() {
    const now = new Date();

    const clock = document.getElementById("clock");
    const date = document.getElementById("date");

    if (clock) {
      clock.textContent = now.toLocaleTimeString();
    }

    if (date) {
      date.textContent = now.toLocaleDateString();
    }
  }

  function signIn() {
    const now = new Date();
    const status = document.getElementById("status");

    status.textContent =
      "Status: Signed in at " + now.toLocaleTimeString();

    status.style.background = "#e8f7ee";
  }

  function signOut() {
    const now = new Date();
    const status = document.getElementById("status");

    status.textContent =
      "Status: Signed out at " + now.toLocaleTimeString();

    status.style.background = "#fdecea";
  }
</script>
